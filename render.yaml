# Database: set DB_URL in Render to your full URI, e.g.
# postgresql://postgres:YOUR_PASSWORD@db.orlxefxqijqmvplsmivf.supabase.co:5432/postgres?sslmode=require
# If Render cannot reach the host (IPv6-only direct URL on some networks), use Session pooler from Supabase Connect instead.
services:
  - type: web
    name: jusas
    runtime: docker
    repo: https://github.com/reybien29/jusas
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Jusas
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: FILESYSTEM_DISK
        value: local

# Database (Supabase + Render):
# Do NOT use the "Direct connection" host db.<project-ref>.supabase.co from Render — it often resolves to IPv6
# and fails with: SQLSTATE[08006] ... Network unreachable
#
# In Supabase Dashboard → Connect → Session pooler, copy the URI and set it as DB_URL in Render (Environment).
# Shape (region and project ref come from your project):
#   postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
# If migrations fail on the transaction pooler (port 6543), prefer Session mode (port 5432) for Laravel.
services:
  - type: web
    name: jusas
    runtime: docker
    repo: https://github.com/reybien29/jusas
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Jusas
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: FILESYSTEM_DISK
        value: local

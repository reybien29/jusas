services:
  - type: web
    name: jusas
    runtime: docker
    repo: https://github.com/reybien29/jusas
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Jusas
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: jusas-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: jusas-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: jusas-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: jusas-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: jusas-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: FILESYSTEM_DISK
        value: local

databases:
  - name: jusas-db
    databaseName: jusas_production
    user: jusas
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
